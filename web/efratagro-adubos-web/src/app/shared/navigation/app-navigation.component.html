@if (auth.isAuthenticated()) {
  <header class="topbar">
    <div class="topbar-content">
      <a
        routerLink="/estoque"
        class="brand"
        aria-label="EfratAgro"
      >
        <img
          src="/brand/efratagro-logo-correta.png"
          alt="EfratAgro Agroprodutos"
        />
      </a>

      <nav aria-label="Navegação principal">
        @for (
          item of visibleItems();
          track item.route
        ) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="user-area">
        <div class="user-copy">
          <strong>
            {{
              auth.currentUser()?.email
            }}
          </strong>

          <span>
            {{ roleLabel() }}
          </span>
        </div>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Sair
        </button>
      </div>
    </div>
  </header>
}
